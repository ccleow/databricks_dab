# This is a Databricks asset bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: f40a326d-1f0d-42ba-bc6a-5d3f2074418f

include:
  - resources/*.yml
  - resources/*/*.yml  


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405612105794787.7.azuredatabricks.net
    variables:
      catalog: cc_ws
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-7405612105794787.7.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/chuncheck@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/chuncheck@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cc_ws
      schema: prod
    permissions:
      - user_name: chuncheck@gmail.com
        level: CAN_MANAGE
